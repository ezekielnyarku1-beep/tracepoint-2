<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pathfinder | Reset password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style.css">
    <script defer src="font-loader.js"></script>
</head>
<body class="login-page">
    <main class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <span class="logo-icon">T</span>
                <h1>Pathfinder</h1>
                <p>Asset Traceability System</p>
            </div>
            <h2>Reset your password</h2>
            <p class="login-description">Enter your account email and we&rsquo;ll send a password reset link.</p>
            <form id="reset-form">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>
                <button class="login-button" id="reset-button" type="submit">Send reset link</button>
            </form>
            <p class="signup-message" id="reset-message" role="status" aria-live="polite"></p>
            <p class="signup-prompt"><a href="login.html">Back to sign in</a></p>
        </div>
    </main>
    <script type="module" src="./auth-client.js"></script>
</body>
</html>
