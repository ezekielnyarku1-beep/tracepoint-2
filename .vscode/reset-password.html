<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Pathfinder | Choose a new password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style.css">
    <script defer src="font-loader.js"></script>
</head>
<body class="login-page">
    <main class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <span class="logo-icon">P</span>
                <h1>Pathfinder</h1>
                <p>Asset Traceability System</p>
            </div>
            <h2>Choose a new password</h2>
            <p class="login-description">Use at least 6 characters. Reset links expire after 30 minutes.</p>
            <form id="new-password-form">
                <div class="form-group">
                    <label for="new-password">New password</label>
                    <input
                        type="password"
                        id="new-password"
                        name="password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >
                </div>
                <button class="login-button" id="reset-password-button" type="submit">Reset password</button>
            </form>
            <p class="signup-message" id="new-password-message" role="status" aria-live="polite"></p>
            <p class="signup-prompt"><a href="login.html">Back to sign in</a></p>
        </div>
    </main>
    <script type="module" src="auth-client.js"></script>
</body>
</html>
